name: Release SDK

on:
  workflow_dispatch:
    inputs:
      core-ref:
        description: |
          SDK Stack Core branch or ref to use
        type: string
        default: 'main'

jobs:
#  run-examples:
#    strategy:
#      matrix:
#        jdk: [ 8, 11, 17, 21 ]
#    uses: ./.github/workflows/run-examples.yaml
#    secrets: inherit
#    with:
#      branch: ${{ inputs.branch }}
#      jdk: ${{ matrix.jdk }}

  release-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          path: ${{ github.workspace }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: central
          server-username: SONATYPE_USERNAME
          server-password: SONATYPE_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
          settings-path: ${{ github.workspace }}

      - name: Release SDK
        working-directory: ${{ github.workspace }}/code
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PRIVATE_KEY_PASSPHRASE }}
        run: |
          echo "Starting SDK Release - version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          mvn deploy --settings $GITHUB_WORKSPACE/settings.xml -B -U -P release -DskipTests=true
          echo "SDK Released"
